# Security-Backend: MySQL + backend con un solo comando (no hace falta instalar JDK ni MySQL).
#
#   docker compose up -d --build         levanta MySQL + backend (http://localhost:8081)
#   docker compose up -d mysql-db        SOLO la base de datos (para correr el backend desde IntelliJ)
#   docker compose down                  apaga (los datos se conservan)
#   docker compose down -v               apaga y borra la base de datos local
#
# Entras con  superadmin / Admin12345!  (se crea solo en la base nueva).
# Los puertos y claves se pueden cambiar en un archivo ".env" (ver .env.example); no es obligatorio.
#
# Indira y los casos en prensa los resuelve el microservicio Security-MachineLearning (otro repositorio).
# Si no lo tienes corriendo, el backend funciona igual y esas pantallas responden "servicio no disponible".

name: security-backend

services:

  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: security_db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/security_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # El ML corre en su propio compose y publica su puerto en tu maquina; desde el contenedor se llega por host.docker.internal.
      ML_BASE_URL: http://host.docker.internal:${ML_PORT:-8000}
      ML_API_KEY: ${ML_API_KEY:-dev-internal-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Crea el usuario administrador y los catalogos basicos en la base NUEVA (idempotente).
      APP_SEED_ENABLED: "true"
      APP_SEED_ADMIN_USER: ${ADMIN_USER:-superadmin}
      APP_SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  # Visor de la base de datos en http://localhost:8082 (servidor: mysql-db, usuario: root, clave: root)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - mysql-db

volumes:
  mysql_data:
