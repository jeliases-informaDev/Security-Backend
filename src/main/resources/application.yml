server:
  port: 8081
  error:
    include-message: always

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: security-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/security_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Microservicio de Machine Learning (FastAPI). La clave debe coincidir con INTERNAL_API_KEY del ML.
ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  api-key: ${ML_API_KEY:}
  timeout-seconds: 15
  chat-timeout-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics