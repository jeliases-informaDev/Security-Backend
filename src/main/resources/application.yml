server:
  port: 8081
  error:
    include-message: always

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: security-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/security_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Microservicio de Machine Learning (FastAPI). La clave debe coincidir con INTERNAL_API_KEY del ML.
ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  api-key: ${ML_API_KEY:}
  timeout-seconds: 15
  chat-timeout-seconds: 120

# Firma de los tokens JWT (minimo 32 caracteres). En un entorno real define JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:CLAVE-TEMPORAL-SOLO-PARA-DESARROLLO-123456789}

# Origenes del frontend permitidos por CORS, separados por coma.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Datos iniciales de desarrollo (rol admin, usuario y catalogos). Solo para bases locales nuevas.
app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-user: ${APP_SEED_ADMIN_USER:superadmin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:Admin12345!}
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@security.local}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics