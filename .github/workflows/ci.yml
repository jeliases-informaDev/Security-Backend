# Compila y corre todas las pruebas del backend en cada Pull Request y en cada cambio en main.
# La prueba SecurityBackendApplicationTests.contextLoads levanta la aplicación completa: por eso se arranca
# una MySQL con la misma base, usuario, clave y puerto que application.yml usa por defecto.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: security_db
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3307/security_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root
      # Licencias apagadas en las pruebas: nada sale a la red.
      LICENCIAS_URL: ""
      LICENCIAS_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Esperar a que MySQL responda
        run: |
          # Con el cliente de MySQL del runner se pregunta de verdad; si no estuviera, basta con que el puerto abra.
          listo() {
            if command -v mysqladmin >/dev/null 2>&1; then
              mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent
            else
              (echo > /dev/tcp/127.0.0.1/3307) >/dev/null 2>&1
            fi
          }
          for i in $(seq 1 60); do
            if listo; then
              echo "MySQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió a tiempo"
          exit 1

      - name: Pruebas
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --console=plain

      - name: Subir el reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: build/reports/tests
          if-no-files-found: ignore
